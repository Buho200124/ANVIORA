name: CI

on: [push, pull_request]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [auth-service, core-api, recommendation-service, analysis-service]
    defaults:
      run:
        working-directory: services/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias (sin PyTorch: las pruebas no cargan el modelo real)
        run: |
          grep -v pysentimiento requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Ejecutar pruebas unitarias
        run: python -m pytest -q

  validar-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
