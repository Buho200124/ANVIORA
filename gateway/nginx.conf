# ANVIORA - Gateway (punto de entrada único, puerto 8000 en el host)
# Reparte /api/* a cada microservicio y sirve el frontend estático.

# Docker resuelve los nombres de servicio por este DNS interno. Resolverlos en cada petición
# (en vez de al arrancar) evita que Nginx falle si un servicio aún no está arriba.
resolver 127.0.0.11 valid=10s ipv6=off;

# Anti fuerza bruta en login/registro: máx. 10 peticiones por segundo por IP
limit_req_zone $binary_remote_addr zone=auth_zona:10m rate=10r/s;

log_format anviora '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                   '${request_time}s rid=$request_id upstream=$upstream_addr';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log anviora;
    limit_req_status 429;

    # Cabeceras que identifican la petición a lo largo de todos los servicios
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID      $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY always;
    add_header Referrer-Policy        no-referrer always;

    # Salud del propio gateway (lo usa Docker)
    location = /gateway/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Los endpoints /internal son solo para comunicación entre servicios: nunca salen al exterior
    location /internal/ {
        return 404;
    }

    location /api/auth/ {
        limit_req zone=auth_zona burst=20 nodelay;
        set $destino http://auth-service:8001;
        proxy_pass $destino;
    }

    location /api/recommendations {
        set $destino http://recommendation-service:8003;
        proxy_pass $destino;
    }

    location ~ ^/api/(logs|analysis|dashboard)(/|$) {
        set $destino http://core-api:8004;
        proxy_pass $destino;
    }

    # Frontend estático
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
